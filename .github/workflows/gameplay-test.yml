name: Schatten-Arsenal Boss Drop Gameplay Test
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  boss-drop:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Prepare game resources
        run: |
          python3 tools/repair_assets.py
          tar -xJf shadow-assets.tar.xz -C src/main/resources
      - name: Validate actual mob death and trophy drop
        shell: bash
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          printf 'online-mode=false\nspawn-protection=0\n' > run/server.properties
          (
            sleep 35
            echo 'summon minecraft:wither_skeleton 0 280 0 {Tags:["shadow_knight"],PersistenceRequired:1b}'
            sleep 4
            echo 'damage @e[tag=shadow_knight] 1200 minecraft:generic'
            sleep 5
            echo 'execute if entity @e[type=minecraft:item,nbt={Item:{id:"schattenarsenal:shadow_knight_sigil"}}] run say SHADOW_DROP_CHECK_OK'
            sleep 2
            echo 'stop'
          ) | timeout 105s gradle --no-daemon runServer --console=plain > boss-test.log 2>&1 || true
          tail -n 100 boss-test.log
          grep -F 'Done (' boss-test.log
          grep -F 'SHADOW_DROP_CHECK_OK' boss-test.log
      - name: Upload gameplay test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schatten-boss-drop-test-log
          path: boss-test.log
