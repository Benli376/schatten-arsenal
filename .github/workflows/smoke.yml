name: Schatten-Arsenal Minecraft Smoke Test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Verify and unpack resources
        run: |
          python3 tools/repair_assets.py
          tar -xJf shadow-assets.tar.xz -C src/main/resources
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pixel-art tools
        run: python -m pip install pillow
      - name: Generate upgraded Schatten-Arsenal artwork
        run: python tools/generate_art.py
      - name: Start Minecraft Fabric server for validation
        shell: bash
        run: |
          mkdir -p run
          echo eula=true > run/eula.txt
          printf 'motd=Schatten Arsenal Test\\n' > run/server.properties
          timeout 75s bash -c 'tail -f /dev/null | gradle --no-daemon runServer --console=plain' > smoke.log 2>&1 || true
          tail -n 100 smoke.log
          if grep -q 'Done (' smoke.log; then
            echo 'MINECRAFT SERVER SMOKE TEST PASSED'
          else
            echo 'MINECRAFT SERVER SMOKE TEST FAILED: startup not confirmed'
            exit 1
          fi
          if grep -Eiq 'failed to parse|couldn.t load tag|Exception in server tick loop' smoke.log; then
            echo 'Minecraft logged resource/function errors.'
            exit 1
          fi
      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schatten-server-smoke-log
          path: smoke.log
