name: Schatten-Arsenal Fabric JAR
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Install shadow textures
        run: tar -xJf shadow-assets.tar.xz -C src/main/resources
      - name: Build Fabric mod
        run: gradle --no-daemon clean build
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: schatten-arsenal-jar
          path: build/libs/schatten-arsenal-0.7.0.jar
          if-no-files-found: error
